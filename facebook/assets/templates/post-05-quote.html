<!doctype html><html lang="bn"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
 /* বারবার ব্যবহারের কার্ড। বদলান: ব্যাজ, .q, রেফারেন্স নম্বর ও তারিখ।
    এই কার্ডে কখনো নাম, প্রোফাইল লিংক বা স্ক্রিনশট বসাবেন না। */
 .badges{display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap}
 .badge{font-family:'Noto Sans Bengali',sans-serif;font-weight:500;font-size:20px;letter-spacing:0;
        padding:8px 16px;border-radius:2px;border:1px solid}
 .b-cr{color:var(--accent);border-color:rgba(191,51,71,.45);background:rgba(191,51,71,.08)}
 .b-gr{color:var(--muted);border-color:#2A2A30;background:#141418}
 .quote{border-left:5px solid var(--ink);padding-left:36px}
 .q{font-family:'Noto Serif Bengali',serif;font-weight:600;font-size:50px;line-height:1.55;color:var(--warm)}
 .note{font-family:'Noto Sans Bengali',sans-serif;margin-top:36px;font-size:21px;color:var(--faint);line-height:1.7;max-width:840px}
 .ok{color:#4E8C5B}
</style></head><body><div class="stage"><div class="grid"></div><div class="ghost">দাগ</div><div class="inkbar"></div>

<div class="body">
  <div class="badges">
    <span class="badge b-cr">ভুক্তভোগীকে দোষারোপ</span>
    <span class="badge b-gr">অনলাইন হেনস্তা</span>
    <span class="badge b-gr">বাংলা</span>
  </div>
  <div class="quote">
    <div class="q">“মাঝরাতে বাইরে গেছে,<br>কী আশা করেছিল?”</div>
  </div>
  <div class="note">সংরক্ষিত কমেন্ট। পরিচয় এখানে দেওয়া হয়নি। যাচাই করা এন্ট্রি প্রকাশ করা হয় daag-bd.com-এ।</div>
</div>
