<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Reusable stat card: 1080x1080. EDIT: .big, .claim, .claim-bn, .source. */
  .stage{width:1080px;height:1080px;display:flex;flex-direction:column;justify-content:center;padding:94px 86px}
  .ghost{font-size:560px;left:-50px;bottom:-140px;color:rgba(158,28,44,.055)}
  .inkbar{width:8px}
  .head{position:relative;display:flex;align-items:center;gap:16px;margin-bottom:60px}
  .mark{width:46px;height:46px;border-radius:5px;background:var(--ink);display:flex;align-items:center;
        justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:23px;color:#fff;padding-bottom:3px}
  .nm{font-family:'Playfair Display',serif;font-weight:700;font-size:28px;color:var(--warm);letter-spacing:.03em}
  .kicker{position:relative;font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.3em;
          text-transform:uppercase;color:var(--accent);margin-bottom:30px}
  .big{position:relative;font-family:'Playfair Display',serif;font-weight:700;font-size:230px;
       line-height:.92;color:var(--warm);letter-spacing:-.02em}
  .claim{position:relative;font-family:'Playfair Display',serif;font-size:46px;line-height:1.3;
         color:var(--body);margin-top:34px;max-width:860px}
  .claim-bn{position:relative;font-size:29px;line-height:1.55;color:var(--muted);margin-top:22px;max-width:820px}
  .foot{position:relative;margin-top:58px;border-top:1px solid #1F1F25;padding-top:26px;
        display:flex;justify-content:space-between;
        font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
</style></head><body>
<div class="stage">
  <div class="grid"></div><div class="ghost">দাগ</div><div class="inkbar"></div>
  <div class="head"><div class="mark">দাগ</div><div class="nm">Daag</div></div>
  <div class="kicker">Pattern Analytics</div>
  <div class="big">00%</div>
  <div class="claim">of archived comments on rape cases blamed the survivor’s clothing or movement.</div>
  <div class="claim-bn">সংরক্ষিত মন্তব্যের ০০% ধর্ষণের ঘটনায় ভুক্তভোগীর পোশাক বা চলাফেরাকে দায়ী করেছে।</div>
  <div class="foot"><span>Source: Daag Archive</span><span>daag-bd.com</span></div>
</div></body></html>
