<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_card.css">
<style>
  .stage{width:1640px;height:856px;display:flex;align-items:center;justify-content:center;padding:0}
  .ghost{font-size:470px;left:60px;top:50%;transform:translateY(-50%);color:rgba(158,28,44,.075)}
  .safe{position:relative;width:1420px;height:600px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;text-align:center}
  .st{font-family:'Playfair Display',serif;font-weight:700;font-size:96px;line-height:1.14;color:var(--warm)}
  .st em{font-style:italic;color:var(--accent)}
  .bnl{font-family:'Noto Sans Bengali',sans-serif;font-size:34px;color:var(--muted);margin-top:34px}
  .btm{position:relative;display:flex;align-items:center;gap:20px;margin-top:52px;
       font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
  .mk{width:44px;height:44px;border-radius:5px;background:var(--ink);display:flex;align-items:center;
      justify-content:center;font-family:'Noto Sans Bengali',sans-serif;font-size:21px;color:#fff}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
</style></head><body><div class="stage">
  <div class="grid"></div><div class="ghost">দাগ</div><div class="vig"></div><div class="inkbar"></div>
  <div class="safe">
    <div class="st">Every word <em>leaves a mark.</em></div>
    <div class="bnl">প্রতিটি শব্দ দাগ রেখে যায়।</div>
    <div class="btm"><span class="mk">দাগ</span><span>Daag</span><span class="dot"></span>
      <span>Civic Accountability Archive</span><span class="dot"></span><span>daag-bd.com</span></div>
  </div>
</div></body></html>
