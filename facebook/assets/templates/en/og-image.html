<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Link-preview card: 1200x630. Replaces the SVG that Facebook cannot render. */
  .stage{width:1200px;height:630px;display:flex;align-items:center}
  .ghost{font-size:470px;right:-30px;top:52%;transform:translateY(-50%)}
  .body{position:relative;padding-left:78px;max-width:830px}
  .lockup{display:flex;align-items:center;gap:20px;margin-bottom:40px}
  .mark{width:62px;height:62px;border-radius:6px;background:var(--ink);display:flex;align-items:center;
        justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:30px;color:#fff;padding-bottom:4px}
  .word{font-family:'Playfair Display',serif;font-weight:700;font-size:44px;color:var(--warm);letter-spacing:.03em}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:60px;line-height:1.1;
     color:var(--warm);margin-bottom:26px}
  p{font-size:21px;line-height:1.55;color:var(--muted);max-width:720px;font-weight:400}
  .foot{position:absolute;left:78px;bottom:58px;display:flex;align-items:center;gap:18px;
        font-size:13px;letter-spacing:.24em;color:var(--accent)}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
  .url{color:var(--faint)}
</style></head><body>
<div class="stage">
  <div class="grid"></div><div class="ghost">দাগ</div><div class="vig"></div><div class="inkbar"></div>
  <div class="body">
    <div class="lockup"><div class="mark">দাগ</div><div class="word">Daag</div></div>
    <h1>Online Gender Violence<br>Documentation Archive</h1>
    <p>A verified, human-moderated public record of misogynistic and victim-blaming comments surrounding gender violence in Bangladesh.</p>
  </div>
  <div class="foot mono"><span>Every word leaves a mark</span><span class="dot"></span><span class="url">daag-bd.com</span></div>
</div></body></html>
