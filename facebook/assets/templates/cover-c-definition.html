<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_card.css">
<style>
  .stage{width:1640px;height:856px;display:flex;align-items:center;justify-content:center;padding:0}
  .ghost{font-size:520px;right:-40px;top:50%;transform:translateY(-50%);color:rgba(158,28,44,.06)}
  .safe{position:relative;width:1340px;height:600px;display:flex;flex-direction:column;justify-content:center}
  .word{display:flex;align-items:baseline;gap:30px}
  .bnw{font-family:'Noto Sans Bengali',sans-serif;font-weight:700;font-size:130px;color:var(--warm);line-height:1}
  .ipa{font-family:'DM Mono',monospace;font-size:34px;color:var(--faint);letter-spacing:.04em}
  .pos{font-family:'Playfair Display',serif;font-style:italic;font-size:34px;color:var(--accent)}
  .rule{width:86px;height:2px;background:var(--ink);margin:38px 0 34px}
  .def{font-family:'Playfair Display',serif;font-size:50px;line-height:1.38;color:var(--body);max-width:1180px}
  .def b{color:var(--warm);font-weight:700}
  .btm{position:absolute;bottom:0;right:0;display:flex;align-items:center;gap:20px;
       font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
</style></head><body><div class="stage">
  <div class="grid"></div><div class="ghost">দাগ</div><div class="vig"></div><div class="inkbar"></div>
  <div class="safe">
    <div class="word"><span class="bnw">দাগ</span><span class="ipa">/daag/</span><span class="pos">noun</span></div>
    <div class="rule"></div>
    <div class="def">a <b>stain</b>. the kind that does not wash off.</div>
    <div class="btm"><span style="color:var(--accent)">Civic Accountability Archive · Bangladesh</span>
      <span class="dot"></span><span>daag-bd.com</span></div>
  </div>
</div></body></html>
