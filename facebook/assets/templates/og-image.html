<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700&family=Noto+Sans+Bengali:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Link-preview card, 1200x630. Replaces the SVG that Facebook cannot render. */
  .stage{width:1200px;height:630px;display:flex;align-items:center}
  .ghost{font-size:470px;right:-30px;top:52%;transform:translateY(-50%)}
  .body{position:relative;padding-left:78px;max-width:830px}
  .lockup{display:flex;align-items:center;gap:20px;margin-bottom:40px}
  .mark{width:62px;height:62px;border-radius:6px;background:var(--ink);display:flex;align-items:center;
        justify-content:center;font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:27px;color:#fff}
  .word{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:40px;color:var(--warm);letter-spacing:0}
  h1{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:54px;line-height:1.5;
     color:var(--warm);margin-bottom:26px}
  p{font-family:'Noto Sans Bengali',sans-serif;font-size:21px;line-height:1.85;color:var(--muted);max-width:760px;font-weight:400}
  .foot{position:absolute;left:78px;bottom:58px;display:flex;align-items:center;gap:18px;
        font-size:19px;letter-spacing:0;color:var(--accent);font-family:'Noto Sans Bengali',sans-serif}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
  .url{color:var(--faint);font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
</style></head><body>
<div class="stage">
  <div class="grid"></div><div class="ghost">দাগ</div><div class="vig"></div><div class="inkbar"></div>
  <div class="body">
    <div class="lockup"><div class="mark">দাগ</div></div>
    <h1>অনলাইন হেনস্তার<br>যাচাই করা আর্কাইভ</h1>
    <p>অনলাইনে হেনস্তা, নোংরা কমেন্ট, ভুক্তভোগীকেই দোষ চাপানো। কে কী লিখেছে, সোর্স লিংকসহ যাচাই করে এখানে রাখা হয়।</p>
  </div>
  <div class="foot"><span>প্রতিটি শব্দ দাগ রেখে যায়</span><span class="dot"></span><span class="url">daag-bd.com</span></div>
</div></body></html>
