<!doctype html><html lang="bn"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="_bn.css">
<style>
 .lines{display:flex;flex-direction:column;margin:28px 0 34px}
 .ln{display:flex;align-items:center;gap:36px;padding:27px 0;border-bottom:1px solid #1A1A20}
 .ln:last-child{border-bottom:none}
 .num{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:66px;color:var(--warm);
      width:220px;flex-shrink:0;line-height:1.3}
 .what{font-family:'Noto Sans Bengali',sans-serif;font-size:27px;line-height:1.6;color:var(--muted)}
 .disc{font-family:'Noto Sans Bengali',sans-serif;font-size:22px;line-height:1.75;color:var(--faint);

<div class="head"><div class="mark">দাগ</div></div>
<div class="body">
  <div class="kicker">এখনই সহায়তা দরকার হলে</div>
  <div class="lines">
    <div class="ln"><span class="num">৯৯৯</span><span class="what">জাতীয় জরুরি সেবা</span></div>
    <div class="ln"><span class="num">১০৯</span><span class="what">নারী ও শিশু নির্যাতন প্রতিরোধে সহায়তা</span></div>
    <div class="ln"><span class="num">১০৯৮</span><span class="what">শিশু হেল্পলাইন</span></div>
  </div>
  <div class="disc">দাগ নথি রাখার উদ্যোগ। আমরা জরুরি সেবা নই, চলমান কোনো পরিস্থিতিতে হস্তক্ষেপ করতে পারি না।</div>
</div>
<div class="foot"><span style="color:var(--accent)">হেল্পলাইন</span><span class="url">daag-bd.com</span></div>
