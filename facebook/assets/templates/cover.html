<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Facebook Page cover. Upload 1640x856.
     Desktop crops to centre 624px of height; mobile crops ~25px each side.
     All content kept inside the centre safe box. */
  .stage{width:1640px;height:856px;display:flex;align-items:center;justify-content:center}
  .ghost{font-size:430px;right:72px;top:50%;transform:translateY(-50%)}
  .safe{position:relative;width:1400px;height:600px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;text-align:center}
  .kicker{font-size:15px;letter-spacing:.34em;color:var(--accent);margin-bottom:38px}
  .lockup{display:flex;align-items:center;gap:30px;margin-bottom:30px}
  .mark{width:104px;height:104px;border-radius:8px;background:var(--ink);display:flex;
        align-items:center;justify-content:center;font-family:'Playfair Display',serif;
        font-weight:700;font-size:50px;color:#fff;padding-bottom:6px}
  .word{font-family:'Playfair Display',serif;font-weight:700;font-size:118px;
        color:var(--warm);letter-spacing:.02em;line-height:1}
  .rule{width:92px;height:2px;background:var(--ink);margin-bottom:30px}
  .tag{font-family:'Playfair Display',serif;font-style:italic;font-size:40px;color:var(--body);margin-bottom:14px}
  .tag-bn{font-size:27px;color:var(--muted);margin-bottom:46px}
  .meta{font-size:13px;letter-spacing:.28em;color:var(--faint);display:flex;gap:22px;align-items:center}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
</style></head><body>
<div class="stage">
  <div class="grid"></div>
  <div class="ghost">দাগ</div>
  <div class="vig"></div>
  <div class="inkbar"></div>
  <div class="safe">
    <div class="kicker mono">Civic Accountability Archive · Bangladesh</div>
    <div class="lockup">
      <div class="mark">দাগ</div>
      <div class="word">Daag</div>
    </div>
    <div class="rule"></div>
    <div class="tag">Every word leaves a mark.</div>
    <div class="tag-bn">প্রতিটি শব্দ দাগ রেখে যায়।</div>
    <div class="meta mono">
      <span>Verified Archive</span><span class="dot"></span>
      <span>Human Moderated</span><span class="dot"></span>
      <span>daag-bd.com</span>
    </div>
  </div>
</div></body></html>
