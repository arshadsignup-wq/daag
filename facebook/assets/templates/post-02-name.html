<!doctype html><html lang="bn"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="_bn.css">
<style>
 .names{display:flex;flex-direction:column;margin-top:4px}
 .row{display:flex;align-items:baseline;gap:34px;padding:21px 0;border-bottom:1px solid #1A1A20}
 .row:last-child{border-bottom:none}
 .w{font-family:'Noto Serif Bengali',serif;font-weight:600;font-size:42px;color:#7E7873;width:210px;flex-shrink:0}
 .mean{font-family:'Noto Sans Bengali',sans-serif;font-size:25px;color:#5C5852;line-height:1.6}
 .row.on{border-left:5px solid var(--ink);padding-left:28px;margin-left:-33px;background:rgba(158,28,44,.07)}
 .row.on .w{color:#fff;font-weight:700}.row.on .mean{color:var(--body)}
</style></head><body><div class="stage"><div class="grid"></div><div class="ghost">দাগ</div><div class="inkbar"></div>
<div class="head"><div class="mark">দাগ</div></div>
<div class="body">
  <div class="kicker">নামটা দাগ কেন</div>
  <div class="names">
    <div class="row"><span class="w">নিশান</span><span class="mean">চিহ্ন</span></div>
    <div class="row"><span class="w">মুখবির</span><span class="mean">সাক্ষী</span></div>
    <div class="row"><span class="w">চরিত্র</span><span class="mean">যে শব্দটা ভুক্তভোগীর বিরুদ্ধেই ব্যবহার হয়</span></div>
    <div class="row"><span class="w">চিহ্নিত</span><span class="mean">শনাক্ত করা</span></div>
    <div class="row on"><span class="w">দাগ</span><span class="mean">যে দাগ সহজে মোছে না</span></div>
  </div>
  <div class="lead" style="font-size:25px">নামটা আঙুল তোলে যে কমেন্ট করেছে তার দিকে, যাকে নিয়ে করেছে তার দিকে নয়<span class="d">।</span></div>
</div>
<div class="foot"><span style="color:var(--accent)">প্রতিটি শব্দ দাগ রেখে যায়</span><span class="url">daag-bd.com</span></div>
</div></body></html>
