<!DOCTYPE html>
<!--
  A real 404 page.

  This file used to be the GitHub Pages SPA hack: it stashed location.pathname
  in sessionStorage and did location.replace('/'). On Vercel that meant every
  route on the site -- /archive, /contact, all nine in sitemap.xml -- answered
  with HTTP 404 and a blank body, then bounced to the homepage in JavaScript.
  Readers mostly got there; crawlers and link previews did not, and a reader
  with JavaScript off got a blank page.

  vercel.json now rewrites the real routes to index.html with a 200, so this
  file is reached only by a path that genuinely does not exist. Sending that to
  the homepage would hide the mistake, so it says so instead.
-->
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>পাতাটি পাওয়া যায়নি · দাগ</title>
<link rel="icon" href="/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700&family=Hind+Siliguri:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9e0cc; --card:#fdfaf2; --text:#1c1917; --text2:#5a5248;
    --text3:#8b8277; --accent:#c8231a; --border:#d9d0bd;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1a1714;--card:#231f1a;--text:#f3ede2;--text2:#bdb3a5;
          --text3:#8d8276;--border:#352f28}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:1.5rem;background:var(--bg);color:var(--text);
    font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.75}
  .card{background:var(--card);border:1px solid var(--border);border-radius:4px;
    max-width:30rem;width:100%;padding:2.5rem 2rem;text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .mark{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-weight:700;
    font-size:1.6rem;color:var(--accent);line-height:1.3;margin-bottom:1.5rem}
  .code{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text3);margin-bottom:.6rem}
  h1{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-weight:500;
    font-size:1.35rem;line-height:1.4;margin:0 0 .75rem}
  p{color:var(--text2);font-size:14px;margin:0 0 .4rem}
  .en{color:var(--text3);font-size:12.5px;margin-bottom:1.75rem}
  a.home{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    font-size:13.5px;padding:.7rem 1.5rem;border-radius:3px}
  a.home:hover{opacity:.9}
  .links{margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border);
    display:flex;gap:1.1rem;justify-content:center;flex-wrap:wrap}
  .links a{color:var(--text2);text-decoration:none;font-size:13px;
    border-bottom:1px solid transparent}
  .links a:hover{color:var(--text);border-bottom-color:var(--accent)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">দাগ</div>
    <div class="code">404</div>
    <h1>এই পাতাটি পাওয়া যায়নি</h1>
    <p>লিংকটি হয়তো ভুল, কিংবা পাতাটি সরিয়ে নেওয়া হয়েছে।</p>
    <p class="en">We could not find that page.</p>
    <a class="home" href="/">প্রথম পাতায় ফিরুন</a>
    <nav class="links">
      <a href="/archive">আর্কাইভ</a>
      <a href="/search">প্রোফাইল খুঁজুন</a>
      <a href="/submit">প্রমাণ জমা দিন</a>
      <a href="/contact">যোগাযোগ</a>
    </nav>
  </main>
</body>
</html>
